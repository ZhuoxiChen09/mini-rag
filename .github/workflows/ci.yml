name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6,<3'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Evaluate retrieval against the sample corpus
        continue-on-error: true
        env:
          HF_HUB_ETAG_TIMEOUT: '15'
          HF_HUB_DOWNLOAD_TIMEOUT: '45'
        run: python -m src.eval_retrieval
